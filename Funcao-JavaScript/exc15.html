    <title>Exercicio 15</title>
    <script>

        var numeros = [8,7,6,5,4]
        function somar (lista){
            soma = 0
            for(var n = 0; n < lista.length; n = n + 1){
                soma += lista[n]
            }
            return soma
        }
        alert("A soma dos numeros da lista é: " + somar(numeros))
    </script>

    <title>Exercicio 5</title>
    <script>

        function Verificarnumero (numero){
            if(numero > 0 ){
                return "Positivo";
            }
            else if(numero < 0){
                return "Negativo";
            }
            else {
                return "Igual a zero";
            }
           
        }
        var numero = Number(prompt("Digite um numero: "))
        alert(Verificarnumero(numero))
    </script>

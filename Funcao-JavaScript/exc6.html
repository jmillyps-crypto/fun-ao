    <script>

        function parOUimpar (numero){
            if(numero % 2 == 0){
                return "Número par";
            }
            else {
                return "Número impar";
            }
        
        }
        var numero = Number(prompt("Digite um numero: "))
        alert(parOUimpar(numero))
    </script>

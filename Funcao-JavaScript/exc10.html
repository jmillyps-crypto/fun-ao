<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 10</title>
    <script>

        function media (nota1,nota2){
            return (nota1 + nota2) / 2
            
        }
        function situacaoAluno (media){
            if(media >= 6){
                return "Aprovado"
            }
            else{
                return "Reprovado"
            }
        }

        var nota1 = Number(prompt("Digite a primeira nota: "))
        var nota2 = Number(prompt("Digite a segunda nota: "))

        var media = media(nota1,nota2)
        var situacao = situacaoAluno(media)

        alert("A media do aluno é: " + media + ", e sua situação é: " + situacao)
    </script>
</head>

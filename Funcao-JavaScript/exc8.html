    <title>Exercicio 8</title>
    <script>

        function verificarMaior (num1,num2){
            if(num1 > num2){
                return num1 + " é maior que " + num2

            }
            else if(num1 < num2){
                return num2 + " é maior que " + num1

            }
            else{
                return "Os dois numeros são iguais"

            }
        }
        var num1 = Number(prompt("Digite um numero: "))
        var num2 = Number(prompt("Digite outro numero"))
        alert(verificarMaior(num1,num2))
    </script>
